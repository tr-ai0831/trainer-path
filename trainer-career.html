<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホネさん診断 - プレミアム版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#211C17; --surface:#2A241D; --surface-alt:#2E2820;
    --gold:#C6A651; --gold-soft:#E4D7AE; --ivory:#EAE0CB; --muted:#A79C87;
    --line:#3D362C; --brick:#A85B4E; --sage:#7A8468;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ivory); font-family:'Noto Sans JP', sans-serif;
    display:flex; justify-content:center; padding:40px 16px 90px;
  }
  .app{ width:100%; max-width:480px; }
  .brand{ text-align:center; margin-bottom:24px; }
  .brand .kicker{ font-size:10.5px; letter-spacing:0.28em; color:var(--gold); font-weight:500; }
  .brand h1{ font-family:'Shippori Mincho', serif; font-weight:600; font-size:23px; margin:10px 0 0; letter-spacing:.02em; }
  .brand .rule{ width:36px; height:1px; background:var(--gold); margin:14px auto 0; opacity:.6; }

  .phase-label{ text-align:center; font-size:10px; font-weight:500; color:var(--muted); margin-bottom:6px; letter-spacing:.18em; text-transform:uppercase; }
  .sub-label{ text-align:center; font-size:13px; font-weight:500; color:var(--gold-soft); margin-bottom:14px; min-height:18px; font-family:'Shippori Mincho', serif; }

  .progress-track{ height:1px; background:var(--line); margin:0 0 28px; position:relative; }
  .progress-fill{ height:1px; background:var(--gold); transition:width .3s ease; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:2px;
    padding:34px 26px 28px;
  }

  .qeyebrow{ text-align:center; font-family:'Shippori Mincho', serif; font-size:34px; color:var(--line); font-weight:600; margin-bottom:4px; letter-spacing:.03em; }
  .qtheme{ text-align:center; font-size:10.5px; letter-spacing:.16em; color:var(--gold); text-transform:uppercase; margin-bottom:18px; }

  .time-badge{ display:block; width:fit-content; margin:0 auto 18px; border:1px solid var(--gold); color:var(--gold-soft); font-weight:500; font-size:11.5px; letter-spacing:.08em; padding:7px 18px; border-radius:99px; }
  .remaining-badge{ display:block; width:fit-content; margin:0 auto 16px; color:var(--muted); font-weight:500; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; }
  .intuition-hint{ text-align:center; font-size:12px; color:var(--muted); font-style:italic; margin:0 0 20px; font-family:'Shippori Mincho', serif; }
  .intuition-hint.small{ font-size:11px; margin:10px 0 18px; }

  .question{
    font-family:'Shippori Mincho', serif; font-weight:600; font-size:19px;
    text-align:center; margin:0 0 26px; line-height:1.7; color:var(--ivory);
  }

  .answers{ display:flex; flex-direction:column; gap:2px; }
  .answer{
    border-top:1px solid var(--line);
    padding:16px 4px; cursor:pointer; text-align:left;
    transition: padding-left .2s ease, color .2s ease;
    color:var(--muted); font-size:14px; font-weight:400; line-height:1.6;
    position:relative;
  }
  .answer:last-child{ border-bottom:1px solid var(--line); }
  .answer::before{ content:'―'; color:var(--line); margin-right:10px; transition:color .2s ease; }
  .answer:hover{ padding-left:14px; color:var(--ivory); }
  .answer:hover::before{ color:var(--gold); }

  .info-text{ font-size:13.5px; line-height:2; color:var(--muted); margin:0 0 20px; text-align:center; }
  .info-box{
    border:1px solid var(--line); border-radius:2px; padding:18px 18px; margin-bottom:22px; font-size:13px; line-height:1.9; color:var(--muted);
  }
  .info-box .row{ margin-bottom:8px; }
  .info-box .row b{ color:var(--gold-soft); font-weight:500; }
  .next-btn{
    display:block; width:100%; padding:15px; border-radius:2px; border:1px solid var(--gold);
    background:transparent; color:var(--gold-soft); font-weight:500; font-size:13px; letter-spacing:.12em; cursor:pointer;
    font-family:'Noto Sans JP', sans-serif; transition:background .2s ease, color .2s ease; text-transform:uppercase;
  }
  .next-btn:hover{ background:var(--gold); color:var(--bg); }

  .result h2{
    font-family:'Shippori Mincho', serif; font-weight:600; font-size:22px;
    text-align:center; margin:6px 0 22px; line-height:1.5; color:var(--ivory);
  }
  .start-point{ text-align:center; font-size:11.5px; color:var(--muted); margin-bottom:20px; letter-spacing:.03em; }

  .type-reveal{ text-align:center; border:1px solid var(--gold); border-radius:2px; padding:26px 20px; margin:6px 0 28px; position:relative; }
  .type-reveal::before{ content:''; position:absolute; inset:5px; border:1px solid rgba(198,166,81,0.28); pointer-events:none; }
  .type-kicker{ font-size:10px; letter-spacing:.28em; color:var(--gold); font-weight:500; margin-bottom:12px; }
  .type-name{ font-family:'Shippori Mincho', serif; font-weight:600; font-size:24px; color:var(--ivory); margin-bottom:4px; }
  .type-sub{ font-size:11px; color:var(--gold); letter-spacing:.1em; font-family:'Noto Sans JP', sans-serif; }
  .type-desc{ font-size:12.5px; line-height:1.95; color:var(--muted); max-width:340px; margin:14px auto 0; }
  .start-point b{ color:var(--gold-soft); font-weight:500; }

  .radar-section{ margin:6px 0 26px; }
  .radar-title{ font-size:10px; font-weight:500; color:var(--muted); letter-spacing:.16em; margin-bottom:6px; text-align:center; text-transform:uppercase; }

  .bridge{
    font-size:13.5px; line-height:2; color:var(--gold-soft); font-family:'Shippori Mincho', serif;
    padding:20px 4px; margin-bottom:26px; text-align:center; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .result p{ font-size:13.5px; line-height:2; color:var(--muted); margin:0 0 12px; }

  .reality-box{ border:1.5px solid var(--brick); border-radius:2px; padding:24px 22px; margin:24px 0; background:rgba(168,91,78,0.06); }
  .reality-box .rtitle{ font-family:'Shippori Mincho', serif; font-size:16px; font-weight:600; color:var(--brick); margin-bottom:14px; }
  .reality-box p{ margin:0 0 12px; font-size:13px; line-height:2; color:var(--ivory); }
  .reality-box p:last-child{ margin-bottom:0; }

  .badge-block{ border:1px solid var(--line); border-radius:2px; padding:24px 22px; margin:22px 0; }
  .badge-block.strength{ border-color:var(--gold); }
  .badge-block.weak{ border-color:#4A3B34; }
  .badge-header{ margin-bottom:16px; border-bottom:1px solid var(--line); padding-bottom:14px; }
  .badge-label{ font-size:10px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; display:block; margin-bottom:8px; }
  .badge-label.strength{ color:var(--gold); }
  .badge-label.weak{ color:var(--brick); }
  .badge-title{ font-family:'Shippori Mincho', serif; font-weight:600; font-size:19px; color:var(--ivory); }
  .badge-score{ font-size:11px; font-weight:400; color:var(--muted); margin-left:8px; }
  .prep p{ margin:0 0 12px; font-size:13px; line-height:2; color:var(--muted); }

  .action-list{ border-radius:2px; padding:16px 18px; margin:14px 0; }
  .action-list.gold{ background:rgba(198,166,81,0.08); border-left:2px solid var(--gold); }
  .action-list.brick{ background:rgba(168,91,78,0.08); border-left:2px solid var(--brick); }
  .action-list-title{ font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; margin-bottom:10px; color:var(--gold-soft); }
  .action-list.brick .action-list-title{ color:#D19488; }
  .action-list ul{ margin:0; padding:0; list-style:none; }
  .action-list li{ font-size:12.5px; line-height:1.9; color:var(--ivory); padding-left:16px; position:relative; margin-bottom:7px; }
  .action-list li:last-child{ margin-bottom:0; }
  .action-list.gold li::before{ content:'◆'; position:absolute; left:0; top:1px; font-size:8px; color:var(--gold); }
  .action-list.brick li::before{ content:'◆'; position:absolute; left:0; top:1px; font-size:8px; color:var(--brick); }

  .tree{ margin: 24px 0; }
  .tree-title{ font-size:10px; font-weight:500; color:var(--muted); letter-spacing:.16em; margin-bottom:16px; text-transform:uppercase; }
  .tree-axis{ font-family:'Shippori Mincho', serif; font-size:14px; font-weight:600; margin:18px 0 8px; color:var(--gold-soft); }
  .tree-group{ font-size:11px; font-weight:500; color:var(--muted); margin:8px 0 4px 8px; letter-spacing:.05em; }
  .tree-sub{ font-size:10.5px; font-weight:400; color:#6B6355; margin:5px 0 3px 16px; }
  .tree-subsub{ font-size:10px; font-weight:400; color:#5A5347; margin:4px 0 2px 24px; }
  .leaf-row{ display:flex; align-items:center; gap:8px; margin:4px 0; }
  .leaf-name{ font-size:10.5px; font-weight:400; width:72px; flex-shrink:0; color:var(--muted); }
  .leaf-track{ flex:1; height:1px; background:var(--line); position:relative; }
  .leaf-fill{ height:1px; position:absolute; top:0; left:0; }
  .leaf-fill.value{ background:var(--gold); opacity:.4; }
  .leaf-fill.vision{ background:var(--gold); opacity:.4; }
  .leaf-fill.core{ background:var(--brick); opacity:1; }
  .leaf-fill.top{ background:var(--gold); opacity:1; }
  .leaf-row.core .leaf-name{ color:var(--brick); }
  .leaf-row.top .leaf-name{ color:var(--gold); }
  .leaf-score{ font-size:9.5px; font-weight:400; color:var(--muted); width:28px; text-align:right; flex-shrink:0; }

  .next-step{ border-top:1px solid var(--line); padding:22px 0; }
  .next-step .label{ font-size:10px; font-weight:500; color:var(--gold); letter-spacing:.16em; margin-bottom:14px; display:block; text-transform:uppercase; }
  .tool-list{ margin:0; padding:0; list-style:none; }
  .tool-item{ margin-bottom:14px; padding-left:16px; border-left:1px solid var(--line); }
  .tool-item:last-child{ margin-bottom:0; }
  .tool-name{ font-weight:500; font-size:12.5px; color:var(--gold-soft); display:block; margin-bottom:3px; font-family:'Shippori Mincho', serif; }
  .tool-howto{ font-size:12px; line-height:1.8; color:var(--muted); margin:0; }
  .check-label{ font-size:9.5px; font-weight:500; color:var(--gold); letter-spacing:.1em; margin:10px 0 5px; text-transform:uppercase; }
  .check-list{ margin:0; padding:0; list-style:none; }
  .check-item{ margin-bottom:6px; }
  .check-real{ display:flex; align-items:flex-start; gap:8px; font-size:11px; line-height:1.8; color:var(--muted); cursor:pointer; }
  .check-real input[type="checkbox"]{ accent-color:var(--gold); width:13px; height:13px; margin-top:2px; flex-shrink:0; cursor:pointer; }
  .check-real input[type="checkbox"]:checked ~ *{ color:var(--ivory); }
  .universal-box{ border-top:1px solid var(--line); padding:22px 0; }
  .universal-box .label{ font-size:10px; font-weight:500; color:var(--sage); letter-spacing:.16em; margin-bottom:14px; display:block; text-transform:uppercase; }
  .self-check-panel{ border-top:1px solid var(--line); padding:22px 0; }
  .self-check-panel .label{ font-size:10px; font-weight:500; color:var(--brick); letter-spacing:.16em; margin-bottom:10px; display:block; text-transform:uppercase; }
  .self-check-intro{ font-size:12px; line-height:1.8; color:var(--muted); margin:0 0 16px; }
  .self-check-result{ margin-top:18px; border:1px solid var(--brick); border-radius:2px; padding:18px; }
  .self-check-score{ font-family:'Shippori Mincho', serif; font-size:20px; color:var(--ivory); font-weight:600; margin-bottom:10px; text-align:center; }
  .self-check-result p{ margin:0; font-size:12.5px; line-height:1.9; color:var(--muted); }

  .objectivity-box{
    border-top:1px solid var(--line); padding:24px 0 4px; margin-top:6px; }
  .objectivity-box .otitle{ font-size:11px; font-weight:500; color:var(--gold); margin-bottom:12px; letter-spacing:.1em; font-family:'Shippori Mincho', serif; font-size:15px; }
  .objectivity-box p{ margin:0 0 12px; font-size:12.5px; line-height:1.95; color:var(--muted); }
  .objectivity-box p:last-child{ margin-bottom:0; }

  .freeform-field{ margin-bottom:20px; }
  .freeform-field label{ display:block; font-size:11.5px; font-weight:400; color:var(--muted); margin-bottom:8px; letter-spacing:.03em; }
  .freeform-field input, .freeform-field select, .freeform-field textarea{
    width:100%; border:none; border-bottom:1px solid var(--line); border-radius:0; padding:10px 2px; font-size:14px;
    font-family:'Noto Sans JP', sans-serif; background:transparent; color:var(--ivory);
  }
  .freeform-field input:focus, .freeform-field select:focus, .freeform-field textarea:focus{ outline:none; border-bottom-color:var(--gold); }
  .freeform-field textarea{ resize:vertical; }

  .qual-checklist{ margin-top:4px; }
  .qual-group{ margin-bottom:16px; }
  .qual-group-title{ font-size:10px; font-weight:500; color:var(--gold); letter-spacing:.1em; text-transform:uppercase; margin-bottom:8px; }
  .qual-check{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); padding:5px 0; cursor:pointer; }
  .qual-check input[type="checkbox"], .qual-check input[type="radio"]{ accent-color:var(--gold); width:14px; height:14px; flex-shrink:0; }
  .qual-national{ font-size:9px; font-weight:500; color:var(--gold); border:1px solid var(--gold); padding:1px 6px; border-radius:99px; margin-left:6px; letter-spacing:.03em; }

  .future-box{ border:1px solid var(--gold); border-radius:2px; padding:24px 22px; margin:26px 0; }
  .future-box .ftitle{ font-family:'Shippori Mincho', serif; font-size:15px; font-weight:600; color:var(--gold); margin-bottom:14px; }
  .future-box p{ margin:0 0 12px; font-size:13px; line-height:2; color:var(--gold-soft); font-style:italic; }
  .future-box .fnote{ font-style:normal; color:var(--muted); }

  .loading-spinner{ width:1px; height:40px; background:var(--gold); margin:28px auto; animation:growline 1.4s ease-in-out infinite; }
  .aphorism-text{
    text-align:center; font-family:'Shippori Mincho', serif; font-size:15px; color:var(--gold-soft);
    line-height:1.9; max-width:300px; margin:24px auto 0; min-height:56px; transition:opacity .15s ease;
  }
  @keyframes growline{ 0%,100%{ height:10px; opacity:.3; } 50%{ height:40px; opacity:1; } }
  .ai-badge{ display:inline-block; border:1px solid var(--gold); color:var(--gold); font-size:9px; font-weight:500; padding:2px 9px; border-radius:99px; vertical-align:middle; margin-left:8px; letter-spacing:.1em; }

  .restart{
    display:block; width:100%; padding:15px; border-radius:2px; border:1px solid var(--line);
    background:transparent; color:var(--muted); font-weight:500; font-size:12.5px; letter-spacing:.12em; cursor:pointer;
    font-family:'Noto Sans JP', sans-serif; margin-top:26px; transition:border-color .2s ease, color .2s ease; text-transform:uppercase;
  }
  .restart:hover{ border-color:var(--gold); color:var(--gold-soft); }
  .note{ margin-top:28px; font-size:10.5px; color:#5A5347; text-align:center; line-height:1.9; }

  /* ===== HERO / LANDING ===== */
  .hero-frame{ position:relative; border:1px solid var(--line); padding:44px 24px 34px; overflow:hidden; }
  .hero-frame::before{ content:''; position:absolute; inset:7px; border:1px solid rgba(198,166,81,0.32); pointer-events:none; }
  .hero-frame::after{
    content:''; position:absolute; top:-70px; left:50%; transform:translateX(-50%);
    width:320px; height:320px; border-radius:50%;
    background:radial-gradient(circle, rgba(198,166,81,0.18) 0%, rgba(198,166,81,0) 68%);
    pointer-events:none;
  }
  .hero{ position:relative; text-align:center; z-index:1; background-image:repeating-linear-gradient(135deg, rgba(198,166,81,0.035) 0px, rgba(198,166,81,0.035) 1px, transparent 1px, transparent 15px); }
  .hero-emblem{ display:block; margin:0 auto 14px; }
  .hero .hkicker{ font-size:10.5px; letter-spacing:.32em; color:var(--gold); font-weight:500; }
  .hero-divider{ display:flex; align-items:center; justify-content:center; gap:9px; margin:16px 0; }
  .hero-divider .hd-line{ width:32px; height:1px; background:var(--gold); opacity:.55; }
  .hero-divider .hd-diamond{ width:5px; height:5px; background:var(--gold); transform:rotate(45deg); opacity:.85; }
  .hero h1{
    font-family:'Shippori Mincho', serif; font-weight:600; font-size:32px; line-height:1.55;
    margin:0 0 6px; color:var(--ivory); letter-spacing:.02em;
  }
  .hero h1 .accent{ color:var(--gold); }
  .hero .hsub{ font-size:13.5px; line-height:2; color:var(--muted); max-width:340px; margin:22px auto 0; }
  .hero-features{ display:flex; justify-content:center; gap:0; margin:36px auto 40px; max-width:420px; }
  .hero-feature{ flex:1; padding:0 10px; border-left:1px solid var(--line); }
  .hero-feature:first-child{ border-left:none; }
  .hero-feature svg{ margin:0 auto 10px; display:block; }
  .hero-feature .hf-num{ font-family:'Shippori Mincho', serif; font-size:22px; color:var(--gold); font-weight:600; display:block; margin-bottom:6px; }
  .hero-feature .hf-label{ font-size:10px; color:var(--muted); line-height:1.7; letter-spacing:.02em; }
  .hero-start{
    display:block; width:100%; padding:18px; border-radius:2px; border:1px solid var(--gold);
    background:var(--gold); color:var(--bg); font-weight:600; font-size:14px; letter-spacing:.16em; cursor:pointer;
    font-family:'Noto Sans JP', sans-serif; text-transform:uppercase; transition:opacity .2s ease;
  }
  .hero-start:hover{ opacity:.85; }
  .hero-note{ margin-top:20px; font-size:11px; color:#5A5347; line-height:1.8; }
</style>
</head>
<body>
<div class="app">

  <div id="heroView">
    <div class="hero-frame"><div class="hero">
      <svg class="hero-emblem" width="68" height="68" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r="34" fill="none" stroke="#C6A651" stroke-width="1"/>
        <circle cx="36" cy="36" r="28" fill="none" stroke="#C6A651" stroke-width="0.5" opacity="0.5"/>
        <line x1="24" y1="46" x2="24" y2="34" stroke="#C6A651" stroke-width="2"/>
        <line x1="34" y1="46" x2="34" y2="26" stroke="#C6A651" stroke-width="2"/>
        <line x1="44" y1="46" x2="44" y2="20" stroke="#C6A651" stroke-width="2"/>
        <circle cx="44" cy="20" r="2.5" fill="#C6A651"/>
      </svg>
      <span class="hkicker">TRAINER CAREER DOJO</span>
      <div class="hero-divider"><span class="hd-line"></span><span class="hd-diamond"></span><span class="hd-line"></span></div>
      <h1>あなたの迷いに、<br>白黒をつける。<br><span class="accent">本質発見診断</span></h1>
      <p class="hsub">「知識が足りない」「環境が合わない」——そう思い込んでいるだけかもしれません。31の問いと現在地の棚卸しから、あなたの本当のボトルネックを、逃げ場なく特定します。</p>

      <div class="hero-features">
        <div class="hero-feature">
          <svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9.5" fill="none" stroke="#C6A651" stroke-width="1"/><circle cx="11" cy="11" r="5.5" fill="none" stroke="#C6A651" stroke-width="1"/><circle cx="11" cy="11" r="1.6" fill="#C6A651"/></svg>
          <span class="hf-num">31</span><span class="hf-label">項目の<br>本質診断</span>
        </div>
        <div class="hero-feature">
          <svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9.5" fill="none" stroke="#C6A651" stroke-width="1"/><line x1="11" y1="11" x2="11" y2="5.5" stroke="#C6A651" stroke-width="1"/><line x1="11" y1="11" x2="15" y2="13.5" stroke="#C6A651" stroke-width="1"/></svg>
          <span class="hf-num">05</span><span class="hf-label">分ほどで<br>完了</span>
        </div>
        <div class="hero-feature">
          <svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 2 L13 9 L20 11 L13 13 L11 20 L9 13 L2 11 L9 9 Z" fill="none" stroke="#C6A651" stroke-width="1"/></svg>
          <span class="hf-num">AI</span><span class="hf-label">による<br>個別診断</span>
        </div>
      </div>

      <button class="hero-start" id="heroStart">診断をはじめる</button>
      <p class="hero-note">回答は保存されません。正直に、直感で答えてください。</p>
    </div></div>
  </div>

  <div id="quizView" style="display:none;">
    <div class="brand">
      <span class="kicker">TRAINER CAREER DOJO</span>
      <h1>本質発見診断</h1>
      <div class="rule"></div>
    </div>

    <div class="phase-label" id="phaseLabel"></div>
    <div class="sub-label" id="subLabel"></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

    <div class="card" id="card"></div>

    <div class="note">Rough Prototype — Premium Edition</div>
  </div>

</div>

<script>
// ============================
// PHASE 1: キャリアの悩み

function getDominantCluster(clusterAvg){
  let dominant = 'jiatama';
  let max = -Infinity;
  Object.keys(clusterAvg).forEach(function(k){ if(clusterAvg[k] > max){ max = clusterAvg[k]; dominant = k; } });
  return dominant;
}

function evaluateSelfCheck(){
  const boxes = document.querySelectorAll('.self-check-box');
  const total = boxes.length;
  const checked = Array.from(boxes).filter(function(b){ return b.checked; }).length;
  const pct = total > 0 ? Math.round((checked / total) * 100) : 0;
  const resultEl = document.getElementById('selfCheckResult');
  if(!resultEl){ return; }

  let verdict = '';
  if(pct >= 80){
    verdict = '有言実行できている人です。ここまでの実行率は、正直言って稀です。「知っている」で終わらせず「やっている」まで持っていけているのは、大きな強みです。この調子を落とさず継続してください。';
  } else if(pct >= 50){
    verdict = '半分程度は実行できていますが、「知っている」と「本当にやっている」の間には、まだ差があります。チェックが付かなかった項目の中から、今週中に1つだけ着手してください。全部を一度にやろうとしないことが、続けるコツです。';
  } else {
    verdict = '正直に言います。ここまで読んで「いいこと言うな」と思っただけで、実際の行動にはほとんど移せていないようです。知識と行動の差、それがあなたの停滞の正体です。今日、チェックが付かなかった項目から1つだけ選んで、今すぐ着手してください。';
  }

  const otherEl = document.getElementById('selfCheckOther');
  const otherText = otherEl ? otherEl.value.trim() : '';
  let otherNote = '';
  if(otherText.length > 0){
    otherNote = `<p>それに加えて申告してくれた独自の取り組み「${otherText}」も、立派な行動量です。ただし、具体的な頻度や量を自分で言語化できているかどうかが、継続できる人とできない人の分かれ目になります。曖昧なままにせず、数字で管理する習慣をつけてください。</p>`;
  }

  resultEl.innerHTML = `
    <div class="self-check-score">${checked} / ${total} 項目 (${pct}%)</div>
    <p>${verdict}</p>
    ${otherNote}
  `;
  resultEl.style.display = 'block';
}

    const labelMap = { p1:'第一章 — キャリアの悩み', p2:'第二章 — 現状の把握' };
    phaseLabel.textContent = labelMap[s.phase];
    subLabel.textContent = '';
    const q = s.data;
    card.innerHTML = `
      <div class="question">${q.q}</div>
      <div class="answers">
        ${q.answers.map((a,i)=>`
          <div class="answer" data-idx="${i}">${a.text}</div>
        `).join('')}
      </div>
    `;
    card.querySelectorAll('.answer').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = el.getAttribute('data-idx');
        const chosen = q.answers[idx];
        answersStore[s.field] = chosen.value !== undefined ? chosen.value : chosen.label;
        answersStore[s.field + 'Label'] = chosen.label;

      const incomeChecked = document.querySelector('input[name="ffIncomeRange"]:checked');
      answersStore.income = incomeChecked ? incomeChecked.getAttribute('data-label') : '';

      const achievementChecked = Array.from(document.querySelectorAll('input[name="ffAchievementCheck"]:checked')).map(function(el){ return el.value; });
      const achievementSelected = achievementOptions.filter(function(a){ return achievementChecked.indexOf(a.key) !== -1 && a.key !== 'none'; });
      const achievementDetail = document.getElementById('ffAchievementDetail').value.trim();
      const achievementParts = achievementSelected.map(function(a){ return a.label; });
      if(achievementDetail.length > 0){ achievementParts.push(achievementDetail); }
      answersStore.achievement = achievementParts.length > 0 ? achievementParts.join('、') : '';

      answersStore.otherDegree = document.getElementById('ffOtherDegree').value;

      const checked = Array.from(document.querySelectorAll('input[name="ffQual"]:checked')).map(function(el){ return el.value; });
      const allItems = qualificationOptions.reduce(function(acc, g){ return acc.concat(g.items); }, []);
      const selected = allItems.filter(function(it){ return checked.indexOf(it.key) !== -1 && it.key !== 'none'; });
      const checklistLabels = selected.map(function(it){ return it.label; });
      const otherDegreeText = answersStore.otherDegree && answersStore.otherDegree.trim().length > 0 ? [answersStore.otherDegree.trim()] : [];
      const allQualLabels = checklistLabels.concat(otherDegreeText);
      answersStore.qualification = allQualLabels.length > 0 ? allQualLabels.join('、') : '特になし';
      answersStore.hasNationalQualification = selected.some(function(it){ return it.national; });

      answersStore.futureVision = document.getElementById('ffFuture').value;
      goNext();
    });
    return;
  }

  if(s.type === 'leaf'){
    const lq = s.leaf;
    const axis = axisOfCluster(lq.cluster);
    const remaining = leafQuestions.length - s.headerIdx;
    phaseLabel.textContent = '第三章 — 課題発見 (' + (axis === 'value' ? 'Value' : 'Vision') + ')';
    subLabel.textContent = lq.label;
    card.innerHTML = `
      <div class="qeyebrow">${String(s.headerIdx+1).padStart(2,'0')}</div>
      <div class="remaining-badge">残り ${remaining} 問</div>
      <div class="question">${lq.q}</div>
      <div class="intuition-hint small">直感でパッと選んでOK</div>
      <div class="answers">
        ${lq.answers.map((a,i)=>`
          <div class="answer" data-idx="${i}">${a.text}</div>
        `).join('')}
      </div>
    `;
    card.querySelectorAll('.answer').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = el.getAttribute('data-idx');
        const chosen = lq.answers[idx];
        leafScores[lq.key] += chosen.score;
        goNext();
      });
    });
    return;
  }
}

function leafRowHtml(key, coreKey, topKey, axisClass){
  const lq = leafQuestions.find(d=>d.key===key);

  let rowCls = 'leaf-row';

      <span class="leaf-score">${scoreOutOf5(key)}/5</span>

function renderGroup(node, depth, axisClass, coreKey, topKey){
  let html = '';
  const clsByDepth = {1:'tree-group', 2:'tree-sub', 3:'tree-subsub'};
  html += `<div class="${clsByDepth[depth] || 'tree-subsub'}">${node.label}</div>`;
  if(node.children){
    node.children.forEach(c => { html += renderGroup(c, depth+1, axisClass, coreKey, topKey); });
  } else if(node.leaves){
    node.leaves.forEach(k => { html += leafRowHtml(k, coreKey, topKey, axisClass); });
  }
  return html;
}

function renderTree(coreKey, topKey){
  let html = '';
  treeStructure.forEach(axisNode=>{
    html += `<div class="tree-axis">${axisNode.label}</div>`;
    axisNode.children.forEach(child => { html += renderGroup(child, 1, axisNode.axisClass, coreKey, topKey); });
  });
  return html;
}

function computeClusterAverages(){
  const clusters = ['jiatama','competency','expertise','belief','adaptation'];
  const avg = {};
  clusters.forEach(c=>{
    const leaves = leafQuestions.filter(d=>d.cluster===c);
    const sum = leaves.reduce((s,d)=> s + leafScores[d.key], 0);
    const rawAvg = sum / leaves.length;
    avg[c] = (rawAvg / 3) * 5;
  });
  return avg;
}

function buildRadarSVG(avg){
  const axes = ['jiatama','competency','expertise','belief','adaptation'];
  const labels = { jiatama:'地頭', competency:'対人・自己・課題', expertise:'専門力', belief:'価値観信念', adaptation:'環境適応' };
  const cx=150, cy=155, maxR=92;
  const angleStep = (2*Math.PI)/axes.length;
  function pt(i, val){
    const angle = -Math.PI/2 + i*angleStep;
    const r = (val/5)*maxR;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  }
  const polyPoints = axes.map((k,i)=> pt(i, avg[k]).join(',')).join(' ');
  const rings = [1,2,3,4,5].map(level=>{
    const pts = axes.map((k,i)=> pt(i, level).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="#332E27" stroke-width="1"/>`;
  }).join('');
  const axisDecor = axes.map((k,i)=>{
    const edge = pt(i, 5);
    const labelPt = pt(i, 6.15);
    const scorePt = pt(i, 6.9);
    return `<line x1="${cx}" y1="${cy}" x2="${edge[0]}" y2="${edge[1]}" stroke="#332E27" stroke-width="1"/>
      <text x="${labelPt[0]}" y="${labelPt[1]}" font-size="9.5" text-anchor="middle" fill="#E4D7AE" font-weight="500" font-family="Shippori Mincho, serif">${labels[k]}</text>
      <text x="${scorePt[0]}" y="${scorePt[1]}" font-size="9" text-anchor="middle" fill="#948C7A">${avg[k].toFixed(1)}/5</text>`;
  }).join('');
  return `<svg viewBox="0 0 300 340" width="100%" style="max-width:300px;display:block;margin:0 auto;">
    ${rings}
    ${axisDecor}
    <polygon points="${polyPoints}" fill="rgba(198,166,81,0.14)" stroke="#C6A651" stroke-width="1.5"/>
  </svg>`;
}

function startAphorismRotation(){
  let lastIndex = -1;

    const el = document.getElementById('aphorismText');

function getTopBottomLeaves(n){
  const sorted = leafQuestions.slice().sort(function(a,b){ return leafScores[b.key] - leafScores[a.key]; });
  const top = sorted.slice(0, n).map(function(d){ return d.label; });
  const bottom = sorted.slice(-n).map(function(d){ return d.label; }).reverse();
  return { top: top, bottom: bottom };
}

async function fetchPersonalizedAdvice(topKey, coreKey, coreAxis){
  const topLabel = leafLabel(topKey);
  const coreLabel = leafLabel(coreKey);
  const strategyNote = (coreAxis === 'value')
    ? 'この弱点はチームで補強すれば解決できるタイプの弱点です(得意な仲間に頼る方向で書いてください)'
    : 'この弱点は他人に任せられない、自分自身のペースで育てていく必要があるタイプの弱点です(自分で育てる方向で書いてください)';

  const tb = getTopBottomLeaves(3);
  const clusterAvg = computeClusterAverages();
  const clusterSummary = 'jiatama(地頭)=' + clusterAvg.jiatama.toFixed(1) + '/5, competency(対人対自己対課題)=' + clusterAvg.competency.toFixed(1) + '/5, expertise(専門力)=' + clusterAvg.expertise.toFixed(1) + '/5, belief(価値観信念)=' + clusterAvg.belief.toFixed(1) + '/5, adaptation(環境適応)=' + clusterAvg.adaptation.toFixed(1) + '/5';
  const dominantCluster = getDominantCluster(clusterAvg);
  const typeName = typeArchetypes[dominantCluster].name + '(' + typeArchetypes[dominantCluster].sub + ')';

  const sharedFields = {
    topLabel: topLabel,
    coreLabel: coreLabel,
    strategyNote: strategyNote,
    typeName: typeName,
    topLeaves: tb.top.join('、'),
    bottomLeaves: tb.bottom.join('、'),
    clusterSummary: clusterSummary,
    concern: answersStore.concernLabel || '未回答',
    ideal: answersStore.idealLabel || '未回答',
    work: answersStore.workLabel || '未回答',
    life: answersStore.lifeLabel || '未回答',
    effortMindset: answersStore.effortMindsetLabel || '未回答',
    effortVolume: answersStore.effortVolumeLabel || '未回答',
    age: answersStore.age || '未回答',
    gender: answersStore.gender || '未回答',
    income: answersStore.income || '未回答',
    achievement: answersStore.achievement || '未回答',
    qualification: answersStore.qualification || '未回答',
    hasNationalQualification: answersStore.hasNationalQualification ? 'あり(国家資格保有)' : 'なし',
    otherDegree: (answersStore.otherDegree && answersStore.otherDegree.trim().length > 0) ? answersStore.otherDegree.trim() : '',
    futureVision: (answersStore.futureVision && answersStore.futureVision.trim().length > 0) ? answersStore.futureVision : '未回答'
  };

  try{
    const response = await fetch('/api/personalize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sharedFields)
    });
    if(!response.ok){ throw new Error('proxy not available (status ' + response.status + ')'); }
    const data = await response.json();
    if(!data.message){ throw new Error('empty proxy response'); }
    return data.message;
  } catch(proxyError){
    const prompt = buildComprehensivePrompt(sharedFields);
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1200,
        messages: [{ role: "user", content: prompt }]
      })
    });
    if(!response.ok){
      const errBody = await response.text().catch(function(){ return ''; });
      throw new Error('direct API call failed (status ' + response.status + '): ' + errBody);
    }
    const data = await response.json();
    if(!data.content || !Array.isArray(data.content)){
      throw new Error('unexpected API response shape: ' + JSON.stringify(data).slice(0, 200));
    }
    const text = data.content.map(function(item){ return item.type === "text" ? item.text : ""; }).filter(Boolean).join("\n");
    const trimmed = text.trim();
    if(!trimmed){ throw new Error('empty response'); }
    return trimmed;
  }
}

    + '【3段落目】上記を踏まえ、本人が思い描く未来像に対して、強みがどう追い風になるか、弱点や現在地とどう向き合うべきかを、具体的な行動とともに述べてください。\n\n'

    + '【国家資格の保有】' + f.hasNationalQualification + '(国家資格を持っている場合は、その専門性と信頼性を高く評価してください。民間資格のみ、または資格なしの場合は、その点も踏まえて評価してください)\n'

function finishResultRender(coreKey, topKey, coreCluster, coreAxis, aiText, aiFailed, hasProfileData){
  const r = leafInfo[coreKey];
  const bridge = buildBridge(coreKey, r);
  const realityCheck = buildRealityCheck(coreKey);
  const weaknessHtml = (coreAxis === 'value')
    ? buildWeaknessProseValue(coreKey, coreCluster)
    : buildWeaknessProseVision(coreKey);
  const clusterAvg = computeClusterAverages();
  const radarSVG = buildRadarSVG(clusterAvg);
  const dominantCluster = getDominantCluster(clusterAvg);
  const type = typeArchetypes[dominantCluster];

  let aiReportHtml = '';
  if(hasProfileData){
    if(aiText){
      const paragraphs = aiText.split(/\n+/).filter(function(p){ return p.trim().length > 0; })
        .map(function(p){ return '<p>' + p + '</p>'; }).join('');
      aiReportHtml = `
        <div class="future-box">
          <div class="ftitle">AIによる総合診断コメント <span class="ai-badge">AI GENERATED</span></div>
          ${paragraphs}
        </div>
      `;
    } else {
      aiReportHtml = buildProfileFallback();
    }
  }

  card.innerHTML = `
    <div class="result">
      <div class="start-point">最初の入口 — <b>${answersStore.concernLabel}</b> ／ 理想 — <b>${answersStore.idealLabel}</b></div>

      <div class="type-reveal">
        <div class="type-kicker">YOUR TYPE</div>
        <div class="type-name">${type.name}</div>
        <div class="type-sub">— ${type.sub} —</div>
        <p class="type-desc">${type.desc}</p>
      </div>

      <h2>${r.title}</h2>

      <div class="radar-section">
        <div class="radar-title">総合バランス — 5点満点 領域別平均</div>
        ${radarSVG}
      </div>

      <div class="bridge">${bridge}</div>

      ${aiReportHtml}

      ${realityCheck}

      <div class="badge-block weak">
        <div class="badge-header">
          <span class="badge-label weak">あなたの弱点</span>
          <div class="badge-title">${leafLabel(coreKey)} <span class="badge-score">${scoreOutOf5(coreKey)}/5点</span></div>
        </div>
        ${weaknessHtml}
      </div>

      <div class="badge-block strength">
        <div class="badge-header">
          <span class="badge-label strength">あなたの強み</span>
          <div class="badge-title">${leafLabel(topKey)} <span class="badge-score">${scoreOutOf5(topKey)}/5点</span></div>
        </div>
        ${buildStrengthProse(topKey)}
      </div>

      <div class="tree">
        <div class="tree-title">詳細スコア — 全31項目・5点満点</div>
        ${renderTree(coreKey, topKey)}
      </div>

      <div class="next-step">
        <span class="label">合わせて活用したい取り組み — ${clusterLabels[coreCluster]}全般</span>
        ${renderToolList(clusterTools[coreCluster])}
      </div>

      <div class="universal-box">
        <span class="label">全ての能力開発に共通する土台</span>
        ${renderToolList(universalTools)}
      </div>

      <div class="self-check-panel">
        <span class="label">追加診断 — 本当にできているか</span>
        <p class="self-check-intro">上のチェックリストで、実際にやっているものにチェックを入れてください。「知っている」と「やっている」の差を、客観的に評価します。</p>
        <div class="freeform-field">
          <label>リストにない取り組みがあれば(何を・どのくらいの頻度や量で行っているか、具体的に)</label>
          <textarea id="selfCheckOther" rows="3" placeholder="例: 独自に月2回、他店舗のトレーナーと勉強会を開催している"></textarea>
        </div>
        <button class="next-btn" id="selfCheckBtn">自己チェックを診断する</button>
        <div class="self-check-result" id="selfCheckResult" style="display:none;"></div>
      </div>

      <div class="objectivity-box">
        <div class="otitle">最後に — この結果をもっと正確にするために</div>
        <p>この診断は「自分で自分を採点する」自己評価です。とても大事な一歩ですが、限界もあります。心理学には「ジョハリの窓」という考え方があり、自分では気づいていないのに周りにはよく見えている部分(盲点)が、誰にでもあるとされています。自分の顔を鏡なしでは見られないのと同じで、自分の得意・不得意も、自分の目だけでは見えない部分があるのです。</p>
        <p>あなたのことをよく知っている人物複数人に、このテストを使ってあなたのことを評価してもらうと、客観的なヒントが得られます。ぜひ、信頼できる先輩や同僚、上司にも一度試してもらってみてください。</p>
      </div>

      <button class="restart" id="restart">もう一度診断する</button>
    </div>
  `;
  document.getElementById('selfCheckBtn').addEventListener('click', evaluateSelfCheck);
  document.getElementById('restart').addEventListener('click', ()=>{
    stepIndex = 0;
    Object.keys(answersStore).forEach(k=> delete answersStore[k]);
    leafQuestions.forEach(d=>{ leafScores[d.key] = 0; });
    renderStep();
  });
}

});
