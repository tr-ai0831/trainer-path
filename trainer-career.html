<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホネさん診断 - 改訂版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF5EC; --ink:#26242B; --orange:#FF6A3D; --blue:#5B7FBE;
    --pink:#F4A6C6; --teal:#4FA898; --green:#6FA97A; --gold:#D8A400; --card:#FFFFFF; --line:#E7DFD0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans JP', sans-serif;
    display:flex; justify-content:center; padding:32px 16px 80px;
  }
  .app{ width:100%; max-width:480px; }
  .brand{ text-align:center; margin-bottom:16px; }
  .brand .kicker{ font-size:12px; letter-spacing:0.15em; color:var(--orange); font-weight:700; }
  .brand h1{ font-family:'Zen Maru Gothic', sans-serif; font-weight:900; font-size:21px; margin:4px 0 0; }

  .phase-label{ text-align:center; font-size:11px; font-weight:700; color:#9A9284; margin-bottom:6px; letter-spacing:.05em; }
  .sub-label{ text-align:center; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:10px; min-height:18px; }
  .progress{ display:flex; gap:2px; margin:0 0 22px; flex-wrap:wrap; }
  .progress .dot{ flex:1; min-width:3px; height:6px; border-radius:99px; background:var(--line); transition:background .3s; }
  .progress .dot.done.p1{ background:var(--pink); }
  .progress .dot.done.p2{ background:var(--teal); }
  .progress .dot.done.value{ background:var(--orange); }
  .progress .dot.done.vision{ background:var(--blue); }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:24px 20px 20px; box-shadow:0 10px 30px rgba(38,36,43,0.06);
  }
  .mascot-wrap{ display:flex; justify-content:center; margin-bottom:8px; height:100px; align-items:center; }
  .mascot-wrap img{ max-height:100px; max-width:120px; object-fit:contain; animation: pop .35s ease; }
  @keyframes pop{ from{ transform:scale(.85); opacity:0; } to{ transform:scale(1); opacity:1; } }

  .time-badge{ display:block; width:fit-content; margin:0 auto 14px; background:#FFF1E5; color:var(--orange); font-weight:900; font-size:13px; padding:8px 16px; border-radius:99px; }
  .remaining-badge{ display:block; width:fit-content; margin:0 auto 10px; background:var(--ink); color:#fff; font-weight:900; font-size:12px; padding:6px 14px; border-radius:99px; letter-spacing:.03em; }
  .intuition-hint{ text-align:center; font-size:12.5px; color:#8A8478; background:#F7F3EA; border-radius:10px; padding:8px 10px; margin:0 0 16px; }
  .intuition-hint.small{ font-size:11px; padding:6px 8px; margin:8px 0 14px; }

  .qnum{ text-align:center; font-size:12px; color:#9A9284; font-weight:700; letter-spacing:0.1em; }
  .question{
    font-family:'Zen Maru Gothic', sans-serif; font-weight:700; font-size:17px;
    text-align:center; margin:8px 0 12px; line-height:1.5;
  }
  .answers{ display:flex; flex-direction:column; gap:9px; margin-top:14px; }
  .answer{
    display:flex; align-items:center; gap:12px; border:1.5px solid var(--line);
    background:#FFFDF9; border-radius:14px; padding:10px 14px; cursor:pointer;
    transition: border-color .15s, transform .1s, background .15s; text-align:left;
  }
  .answer:hover{ border-color:var(--orange); background:#FFF6EF; }
  .answer:active{ transform:scale(0.98); }
  .answer img{ width:34px; height:34px; object-fit:contain; flex-shrink:0; }
  .answer span{ font-size:13.5px; font-weight:500; line-height:1.4; }

  .info-text{ font-size:14px; line-height:1.9; color:#4A4640; margin:0 0 14px; }
  .info-box{
    background:#F7F3EA; border-radius:14px; padding:14px 16px; margin-bottom:16px; font-size:13px; line-height:1.8; color:#4A4640;
  }
  .info-box .row{ margin-bottom:6px; }
  .info-box .row b{ color:var(--ink); }
  .next-btn{
    display:block; width:100%; padding:12px; border-radius:14px; border:none;
    background:var(--ink); color:#fff; font-weight:700; font-size:14px; cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
  }

  .result h2{
    font-family:'Zen Maru Gothic', sans-serif; font-weight:900; font-size:19px;
    text-align:center; margin:4px 0 14px;
  }
  .start-point{ text-align:center; font-size:12px; color:#8A8478; margin-bottom:10px; }
  .start-point b{ color:var(--ink); }

  .radar-section{ margin:10px 0 18px; }
  .radar-title{ font-size:11px; font-weight:700; color:#8A8478; letter-spacing:.05em; margin-bottom:2px; text-align:center; }

  .bridge{
    font-size:13px; line-height:1.8; color:#4A4640; background:#FDF1E7;
    border-left:3px solid var(--orange); padding:10px 12px; border-radius:8px; margin-bottom:16px;
  }
  .result p{ font-size:13.5px; line-height:1.85; color:#4A4640; margin:0 0 10px; }

  .badge-block{ border-radius:16px; padding:16px; margin:16px 0; }
  .badge-block.strength{ background:linear-gradient(135deg,#FFF6DC,#FFFDF6); border:2px solid #F0D27A; }
  .badge-block.weak{ background:linear-gradient(135deg,#FFEFEA,#FFFBF9); border:2px solid #F3B39E; }
  .badge-header{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .badge-icon{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
  .badge-title-wrap{ flex:1; }
  .badge-label{ font-size:13px; font-weight:900; letter-spacing:.02em; }
  .badge-label.strength{ color:#B8860B; }
  .badge-label.weak{ color:#C0503A; }
  .badge-title{ font-family:'Zen Maru Gothic', sans-serif; font-weight:900; font-size:16px; color:var(--ink); margin-top:2px; }
  .badge-score{ font-size:11px; font-weight:700; color:#8A8478; }
  .prep p{ margin:0 0 10px; font-size:13px; line-height:1.9; }

  .tree{ margin: 14px 0 18px; }
  .tree-title{ font-size:11px; font-weight:700; color:#8A8478; letter-spacing:.05em; margin-bottom:10px; }
  .tree-axis{ font-size:13px; font-weight:900; margin:10px 0 4px; font-family:'Zen Maru Gothic', sans-serif; }
  .tree-axis.value{ color:var(--orange); }
  .tree-axis.vision{ color:var(--blue); }
  .tree-group{ font-size:11.5px; font-weight:700; color:#8A8478; margin:6px 0 3px 10px; }
  .tree-sub{ font-size:10.5px; font-weight:700; color:#B0A899; margin:4px 0 2px 20px; }
  .tree-subsub{ font-size:10px; font-weight:700; color:#C4BCAD; margin:3px 0 2px 30px; }
  .leaf-row{ display:flex; align-items:center; gap:7px; margin:3px 0; }
  .leaf-name{ font-size:10.5px; font-weight:600; width:70px; flex-shrink:0; color:#4A4640; }
  .leaf-track{ flex:1; height:5px; background:#F0ECE2; border-radius:99px; overflow:hidden; }
  .leaf-fill{ height:100%; border-radius:99px; }
  .leaf-fill.value{ background:var(--orange); opacity:.5; }
  .leaf-fill.vision{ background:var(--blue); opacity:.5; }
  .leaf-fill.core{ background:#D64545; opacity:1; }
  .leaf-fill.top{ background:var(--gold); opacity:1; }
  .leaf-row.core .leaf-name{ color:#D64545; font-weight:900; }
  .leaf-row.top .leaf-name{ color:#B8860B; font-weight:900; }
  .leaf-score{ font-size:9.5px; font-weight:800; color:#8A8478; width:28px; text-align:right; flex-shrink:0; }

  .next-step{ background:#F7F3EA; border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .next-step .label{ font-size:11px; font-weight:700; color:var(--orange); letter-spacing:.05em; margin-bottom:6px; display:block; }
  .next-step p{ margin:0; font-size:13px; line-height:1.8; color:#4A4640; }
  .universal-box{ background:#EEF5EC; border-radius:14px; padding:14px 16px; margin-bottom:16px; border:1px dashed #B7D2B4; }
  .universal-box .label{ font-size:11px; font-weight:700; color:var(--green); letter-spacing:.05em; margin-bottom:6px; display:block; }
  .universal-box p{ margin:0; font-size:12.5px; line-height:1.8; color:#4A4640; }

  .objectivity-box{
    background:#FFFBEF; border:1.5px dashed #E8CE7A; border-radius:14px; padding:14px 15px; margin:16px 0; }
  .objectivity-box .otitle{ font-size:12px; font-weight:900; color:#B8860B; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .objectivity-box p{ margin:0 0 8px; font-size:12.5px; line-height:1.85; color:#4A4640; }
  .objectivity-box p:last-child{ margin-bottom:0; }

  .tool-list{ margin:0; padding:0; list-style:none; }
  .tool-item{ margin-bottom:10px; }
  .tool-item:last-child{ margin-bottom:0; }
  .tool-name{ font-weight:900; font-size:12.5px; color:var(--ink); display:block; margin-bottom:2px; }
  .tool-howto{ font-size:12px; line-height:1.7; color:#4A4640; margin:0; }

  .freeform-field{ margin-bottom:14px; }
  .freeform-field label{ display:block; font-size:12px; font-weight:700; color:#8A8478; margin-bottom:6px; }
  .freeform-field input, .freeform-field select, .freeform-field textarea{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13.5px;
    font-family:'Noto Sans JP', sans-serif; background:#FFFDF9; color:var(--ink);
  }
  .freeform-field textarea{ resize:vertical; }

  .future-box{ background:#F3EEFB; border:1.5px solid #D9CBF0; border-radius:14px; padding:14px 16px; margin:16px 0; }
  .future-box .ftitle{ font-size:12px; font-weight:900; color:#8A63C4; margin-bottom:8px; }
  .future-box p{ margin:0 0 8px; font-size:12.5px; line-height:1.8; color:#4A4640; font-style:italic; }
  .future-box .fnote{ font-style:normal; }

  .loading-spinner{ width:36px; height:36px; border:4px solid #F0ECE2; border-top-color:var(--orange); border-radius:50%; margin:24px auto; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .ai-badge{ display:inline-block; background:#8A63C4; color:#fff; font-size:9px; font-weight:900; padding:2px 8px; border-radius:99px; vertical-align:middle; margin-left:4px; }

  .restart{
    display:block; width:100%; padding:12px; border-radius:14px; border:none;
    background:var(--ink); color:#fff; font-weight:700; font-size:14px; cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
  }
  .note{ margin-top:22px; font-size:11px; color:#B0A899; text-align:center; line-height:1.7; }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <span class="kicker">TRAINER CAREER DOJO</span>
    <h1>ホネさん診断: 本質発見ルート</h1>
  </div>

  <div class="phase-label" id="phaseLabel"></div>
  <div class="sub-label" id="subLabel"></div>
  <div class="progress" id="progress"></div>

  <div class="card" id="card"></div>

  <div class="note">※ ラフ試作です。所要時間表示、残り問題数の強調、5点満点のレーダーチャート、客観的評価の推奨コメントを反映しています。</div>
</div>

<script>
// ============================
// 画像プール
// ============================
const scorePool = {
  3: ['25','15','03','24','27','12'],
  2: ['30','19','34','05','10','11'],
  1: ['26','09','32','08','16','01'],
  0: ['29','13','17','20','18','04']
};
function scoreImg(score, seed){
  const pool = scorePool[score];
  return 'assets/' + pool[seed % pool.length] + '.jpg';
}
const headerPool = ['28','35','14','33','31','06','07','02','01','19','17','09'];
function headerImg(i){ return 'assets/' + headerPool[i % headerPool.length] + '.jpg'; }

// ============================
// PHASE 1: キャリアの悩み
// ============================
const concernQ = {
  q: "今、キャリアについて一番気になっているのはどれ?",
  mascot: "assets/17.jpg",
  answers: [
    { text: "独立・開業したい", img: "assets/25.jpg", value: "independence", label: "独立したい" },
    { text: "転職・環境を変えたい", img: "assets/01.jpg", value: "job_change", label: "環境を変えたい" },
    { text: "スキルアップ・専門性を高めたい", img: "assets/31.jpg", value: "skill_up", label: "スキルを上げたい" },
    { text: "人間関係(職場・お客様)に悩んでいる", img: "assets/09.jpg", value: "relationship", label: "人間関係の悩み" },
    { text: "給与・待遇に不満がある", img: "assets/20.jpg", value: "compensation", label: "待遇への不満" },
    { text: "将来に対して、漠然とした不安がある", img: "assets/26.jpg", value: "vague", label: "漠然とした不安" }
  ]
};
const idealQ = {
  q: "本当は、どうしたい?",
  mascot: "assets/07.jpg",
  answers: [
    { text: "今の場所で、もっと力を発揮したい", img: "assets/30.jpg", value: "grow_here", label: "今の場所で力を発揮したい" },
    { text: "新しい環境で、もう一度挑戦したい", img: "assets/12.jpg", value: "new_place", label: "新しい環境に挑戦したい" },
    { text: "自分の裁量で、自由に働きたい", img: "assets/25.jpg", value: "own_way", label: "自分の裁量で働きたい" },
    { text: "一旦立ち止まって、じっくり考えたい", img: "assets/19.jpg", value: "pause", label: "立ち止まって考えたい" },
    { text: "今の生活を、無理なく安定させたい", img: "assets/11.jpg", value: "stabilize", label: "無理なく安定させたい" }
  ]
};

// ============================
// PHASE 2: 現状把握
// ============================
const workQ = {
  q: "今の仕事は、正直どんな状態?",
  mascot: "assets/28.jpg",
  answers: [
    { text: "忙しいけど充実している", img: "assets/27.jpg", label: "忙しいが充実" },
    { text: "正直、しんどい・限界に近い", img: "assets/33.jpg", label: "しんどい・限界近い" },
    { text: "落ち着いているが、物足りなさもある", img: "assets/01.jpg", label: "落ち着いているが物足りない" },
    { text: "悪くはないが、この先が見えない", img: "assets/17.jpg", label: "この先が見えない" }
  ]
};
const lifeQ = {
  q: "プライベート・家庭とのバランスは?",
  mascot: "assets/02.jpg",
  answers: [
    { text: "しっかり両立できている", img: "assets/15.jpg", label: "しっかり両立できている" },
    { text: "なんとか両立できている", img: "assets/30.jpg", label: "なんとか両立できている" },
    { text: "仕事優先になりがち", img: "assets/32.jpg", label: "仕事優先になりがち" },
    { text: "プライベートをかなり犠牲にしている", img: "assets/29.jpg", label: "プライベートを犠牲にしている" }
  ]
};

// ============================
// PHASE 3: 課題発見(31項目診断)
// ============================
const leafQuestions = [
  { key:'verbal', cluster:'jiatama', label:'言語力',
    q:"言葉で情報を扱う時", answers:[
      {text:"話や文章の要点を、瞬時に掴んで整理できる", score:3},
      {text:"時間をかければ、要点を整理できる", score:2},
      {text:"話が長いと、要点を見失いやすい", score:1},
      {text:"言葉で説明されると、理解に時間がかかる", score:0}
    ]},
  { key:'numeric', cluster:'jiatama', label:'数的処理力',
    q:"数字やデータを扱う時", answers:[
      {text:"数字やデータから、すぐに傾向や意味を読み取れる", score:3},
      {text:"時間をかければ、数字から意味を読み取れる", score:2},
      {text:"数字を見ても、あまりピンとこない", score:1},
      {text:"数字を扱うこと自体が苦手", score:0}
    ]},
  { key:'logical', cluster:'jiatama', label:'論理的思考力',
    q:"物事を筋道立てて考える力について", answers:[
      {text:"複雑な問題も、筋道立てて整理し、結論を出せる", score:3},
      {text:"基本的な筋道は立てられる", score:2},
      {text:"考えがまとまらず、堂々巡りになりやすい", score:1},
      {text:"論理立てて考えること自体が苦手", score:0}
    ]},
  { key:'creative', cluster:'jiatama', label:'創造的思考力',
    q:"既存のやり方にとらわれず考える力について", answers:[
      {text:"前例を疑い、新しい仮説や発想を生み出せる", score:3},
      {text:"求められれば、新しい発想も出せる", score:2},
      {text:"基本的には、前例に沿って考えることが多い", score:1},
      {text:"新しい発想を考えること自体に苦手意識がある", score:0}
    ]},
  { key:'affinity', cluster:'competency', label:'親和力',
    q:"初対面の人やお客様との関わり方", answers:[
      {text:"自然に打ち解け、信頼関係をすぐに築ける", score:3},
      {text:"時間をかければ、信頼関係を築ける", score:2},
      {text:"打ち解けるまでに、かなり時間がかかる", score:1},
      {text:"人と距離を縮めること自体が苦手", score:0}
    ]},
  { key:'collaboration', cluster:'competency', label:'協働力',
    q:"チームで物事を進める時", answers:[
      {text:"周りを巻き込みながら、気持ちよく協力し合える", score:3},
      {text:"基本的には協力できるが、時々すれ違いもある", score:2},
      {text:"一人で抱え込んでしまうことが多い", score:1},
      {text:"チームで動くこと自体が苦手", score:0}
    ]},
  { key:'leadership', cluster:'competency', label:'統率力',
    q:"人を引っ張る場面での自分は", answers:[
      {text:"周りを鼓舞しながら、自然にチームを引っ張れる", score:3},
      {text:"任されれば、なんとかチームをまとめられる", score:2},
      {text:"人を引っ張ることに、抵抗を感じる", score:1},
      {text:"リーダー的な役割は、できれば避けたい", score:0}
    ]},
  { key:'emotion_control', cluster:'competency', label:'感情制御力',
    q:"感情が揺さぶられる場面での自分は", answers:[
      {text:"冷静に自分の感情を把握し、コントロールできる", score:3},
      {text:"多少揺れても、時間が経てば持ち直せる", score:2},
      {text:"感情に流されて、判断や言動がぶれることがある", score:1},
      {text:"感情のコントロールに、強い苦手意識がある", score:0}
    ]},
  { key:'self_esteem', cluster:'competency', label:'自信創出力',
    q:"自分に自信を持てているか", answers:[
      {text:"根拠のある自信を持ち、それを行動につなげられる", score:3},
      {text:"ある程度は自信を持てている", score:2},
      {text:"自信を持つこと自体に、苦手意識がある", score:1},
      {text:"自分に自信が持てず、行動が止まりがち", score:0}
    ]},
  { key:'persistence', cluster:'competency', label:'行動持続力',
    q:"行動を続ける力について", answers:[
      {text:"一度決めたことは、モチベーションに関わらずやり切れる", score:3},
      {text:"波はあるが、なんとか続けられる", score:2},
      {text:"最初は頑張れるが、途中で失速しやすい", score:1},
      {text:"行動を継続すること自体が苦手", score:0}
    ]},
  { key:'problem_finding', cluster:'competency', label:'課題発見力',
    q:"課題を見つける力について", answers:[
      {text:"表面化していない課題にも、いち早く気づける", score:3},
      {text:"指摘されれば、課題に気づける", score:2},
      {text:"課題があっても、見過ごしてしまうことが多い", score:1},
      {text:"何が課題なのか、なかなか掴めない", score:0}
    ]},
  { key:'planning', cluster:'competency', label:'計画立案力',
    q:"計画を立てる力について", answers:[
      {text:"目標から逆算して、現実的な計画を組み立てられる", score:3},
      {text:"大まかな計画は立てられる", score:2},
      {text:"計画を立てても、行き当たりばったりになりやすい", score:1},
      {text:"計画を立てること自体が苦手", score:0}
    ]},
  { key:'execution', cluster:'competency', label:'実践力',
    q:"計画を実行に移す力について", answers:[
      {text:"決めたことを、最後までやり切れる", score:3},
      {text:"概ね実行できるが、途中で止まることもある", score:2},
      {text:"計画倒れになることが多い", score:1},
      {text:"実行に移すこと自体に、時間がかかる", score:0}

function renderProgress(){
  progress.innerHTML = '';
  flow.forEach((s,i)=>{
    const d = document.createElement('div');
    let cls = 'dot';
    if(i < stepIndex){
      if(s.phase === 'p1'){ cls += ' done p1'; }
      else if(s.phase === 'p2'){ cls += ' done p2'; }
      else if(s.phase === 'p3'){
        cls += (s.leaf && axisOfCluster(s.leaf.cluster) === 'vision') ? ' done vision' : ' done value';
      }
    }
    d.className = cls;
    progress.appendChild(d);
  });
}

function leafRowHtml(key, coreKey, topKey, axisClass){
  const lq = leafQuestions.find(d=>d.key===key);
  const pct = Math.round((leafScores[key] / 3) * 100);
  let rowCls = 'leaf-row';
  let fillCls = axisClass;
  if(key === coreKey){ rowCls += ' core'; fillCls = 'core'; }
  else if(key === topKey){ rowCls += ' top'; fillCls = 'top'; }
  return `
    <div class="${rowCls}">
      <span class="leaf-name">${lq.label}</span>
      <div class="leaf-track"><div class="leaf-fill ${fillCls}" style="width:${pct}%"></div></div>
      <span class="leaf-score">${scoreOutOf5(key)}/5</span>
    </div>
  `;
}

function renderGroup(node, depth, axisClass, coreKey, topKey){
  let html = '';
  const clsByDepth = {1:'tree-group', 2:'tree-sub', 3:'tree-subsub'};
  html += `<div class="${clsByDepth[depth] || 'tree-subsub'}">${node.label}</div>`;
  if(node.children){
    node.children.forEach(c => { html += renderGroup(c, depth+1, axisClass, coreKey, topKey); });
  } else if(node.leaves){
    node.leaves.forEach(k => { html += leafRowHtml(k, coreKey, topKey, axisClass); });
  }
  return html;
}

function renderTree(coreKey, topKey){
  let html = '';
  treeStructure.forEach(axisNode=>{
    html += `<div class="tree-axis ${axisNode.axisClass}">${axisNode.label}</div>`;
    axisNode.children.forEach(child => { html += renderGroup(child, 1, axisNode.axisClass, coreKey, topKey); });
  });
  return html;
}

function computeClusterAverages(){
  const clusters = ['jiatama','competency','expertise','belief','adaptation'];
  const avg = {};
  clusters.forEach(c=>{
    const leaves = leafQuestions.filter(d=>d.cluster===c);
    const sum = leaves.reduce((s,d)=> s + leafScores[d.key], 0);
    const rawAvg = sum / leaves.length;
    avg[c] = (rawAvg / 3) * 5;
  });
  return avg;
}

function buildRadarSVG(avg){
  const axes = ['jiatama','competency','expertise','belief','adaptation'];
  const labels = { jiatama:'地頭', competency:'対人・自己・課題', expertise:'専門力', belief:'価値観信念', adaptation:'環境適応' };
  const cx=150, cy=155, maxR=92;
  const angleStep = (2*Math.PI)/axes.length;
  function pt(i, val){
    const angle = -Math.PI/2 + i*angleStep;
    const r = (val/5)*maxR;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  }
  const polyPoints = axes.map((k,i)=> pt(i, avg[k]).join(',')).join(' ');
  const rings = [1,2,3,4,5].map(level=>{
    const pts = axes.map((k,i)=> pt(i, level).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="#EDE7D9" stroke-width="1"/>`;
  }).join('');
  const axisDecor = axes.map((k,i)=>{
    const edge = pt(i, 5);
    const labelPt = pt(i, 6.1);
    const scorePt = pt(i, 6.85);
    return `<line x1="${cx}" y1="${cy}" x2="${edge[0]}" y2="${edge[1]}" stroke="#E7DFD0" stroke-width="1"/>
      <text x="${labelPt[0]}" y="${labelPt[1]}" font-size="9.5" text-anchor="middle" fill="#4A4640" font-weight="700">${labels[k]}</text>
      <text x="${scorePt[0]}" y="${scorePt[1]}" font-size="9" text-anchor="middle" fill="#B0A899">${avg[k].toFixed(1)}/5</text>`;
  }).join('');
  return `<svg viewBox="0 0 300 340" width="100%" style="max-width:300px;display:block;margin:0 auto;">
    ${rings}
    ${axisDecor}
    <polygon points="${polyPoints}" fill="rgba(255,106,61,0.28)" stroke="#FF6A3D" stroke-width="2"/>
  </svg>`;
}

function buildBridge(coreKey, r){
  const concernLabel = answersStore.concernLabel;
  if(coreKey.indexOf('knowledge_') === 0 || coreKey.indexOf('skill_') === 0){
    return `最初は「${concernLabel}」という入り口だったけど、掘り下げてみると、確かに「${r.title}」という実力面に伸びしろがありそうです。ただしそれは、他の要素が土台にあってこそ活きてくる部分でもあります。`;
  }
  return `最初は「${concernLabel}」という入り口だったけど、掘り下げてみると、多くの人が思い込みがちな「知識・技術・環境のせい」ではなく、実は「${r.title}」に本当の伸びしろがありそうです。`;
}

function buildStrengthProse(topKey){
  const label = leafLabel(topKey);
  const info = leafInfo[topKey];
  return `
    <div class="prep">
      <p>まず伝えたいのは、「${label}」はすでにあなたの武器だということです。ここを軸にして、これからのキャリアを組み立てていくのがおすすめです。</p>
      <p>実際、ギャラップ社が45か国・120万人以上を対象に行った大規模な調査では、マネジャーが強みに注目したチームは、弱みばかりに注目したチームに比べて、やる気のある人とない人の比率が60対1にもなったのに対し、弱み重視のチームでは2対1にとどまったと報告されています。弱点の克服にエネルギーを使うより、強みを伸ばす方が、ずっと成果や充実感につながりやすいのです。</p>
      <p>具体的には、${info.strengthText}</p>
      <p>「${label}」を使う機会を、自分から意識的に作っていきましょう。それが一番の近道です。</p>
    </div>
  `;
}

function buildWeaknessProseValue(coreKey, coreCluster){
  const label = leafLabel(coreKey);
  const info = leafInfo[coreKey];
  return `
    <div class="prep">
      <p>今回の診断で見えてきたあなたの弱点は、「${label}」です。ここは無理に一人で克服しようとしなくて大丈夫です。</p>
      <p>イギリスの研究者メレディス・ベルビンによるチーム研究では、どんな優秀な人にも「強みとセットになった、仕方のない弱さ」があり、それを一人でゼロにしようとするより、チーム全体で補い合う方がずっとうまくいくことがわかっています。弱点を消そうとする努力よりも、得意な人と組む方が、結果的にチームの成果は上がりやすいのです。</p>
      <p>具体的には、${info.approach} また、日頃から「${clusterLabels[coreCluster]}」が得意なスタッフに、率直に頼ったり教えてもらったりする関係を作っておくと、この部分は自然と補われていきます。</p>
      <p>「${label}」は、あなた一人の課題ではなく、チームで補強すればどうにでもなるものだと捉えてみてください。</p>
    </div>
  `;
}

function buildWeaknessProseVision(coreKey){
  const label = leafLabel(coreKey);
  const info = leafInfo[coreKey];
  return `
    <div class="prep">
      <p>今回の診断で見えてきたあなたの弱点は、「${label}」です。ただしここは、他の誰かに任せることができない、自分自身で育てていく領域でもあります。</p>
      <p>心理学者エドワード・デシとリチャード・ライアンの自己決定理論という研究によると、人が心から前向きに動ける「内発的な動機づけ」は、自分の内側にある自律性・有能感・つながりの感覚から生まれるとされています。他人から押しつけられた目標や価値観では、本当の意味でのやる気にはつながりにくいこともわかっています。だからこそ、ビジョンや価値観に関わる部分は、誰かに肩代わりしてもらうことができないのです。</p>
      <p>具体的には、${info.approach}</p>
      <p>「${label}」は、今はまだ小さくても、自分のペースで育てていく領域だと捉えてみてください。それが、遠回りに見えて一番確実な伸ばし方です。</p>
    </div>
  `;
}

async function renderResult(){
  phaseLabel.textContent = 'RESULT: 本質の落とし所';
  subLabel.textContent = '';
  renderProgress();

  let coreKey = leafQuestions[0].key;
  let minScore = Infinity;
  let topKey = leafQuestions[0].key;
  let maxScore = -Infinity;
  leafQuestions.forEach(d=>{
    if(leafScores[d.key] < minScore){ minScore = leafScores[d.key]; coreKey = d.key; }
    if(leafScores[d.key] > maxScore){ maxScore = leafScores[d.key]; topKey = d.key; }
  });

  const coreCluster = clusterOf(coreKey);
  const coreAxis = axisOfCluster(coreCluster);
  const hasFuture = answersStore.futureVision && answersStore.futureVision.trim().length > 0;

  let aiText = null;
  let aiFailed = false;

  if(hasFuture){
    renderLoadingScreen();
    try{
      aiText = await fetchPersonalizedAdvice(topKey, coreKey, coreAxis);
    } catch(e){
      aiFailed = true;
    }
  }

  finishResultRender(coreKey, topKey, coreCluster, coreAxis, aiText, aiFailed);
}

function renderLoadingScreen(){
  card.innerHTML = `
    <div class="mascot-wrap"><img src="assets/17.jpg" alt=""></div>
    <div class="question">あなた専用のアドバイスを作成中...</div>
    <p class="info-text" style="text-align:center;">入力してもらった未来像をもとに、AIがあなただけのメッセージを考えています。少しだけお待ちください。</p>
    <div class="loading-spinner"></div>
  `;
}

async function fetchPersonalizedAdvice(topKey, coreKey, coreAxis){
  const topLabel = leafLabel(topKey);
  const coreLabel = leafLabel(coreKey);
  const strategyNote = (coreAxis === 'value')
    ? 'この弱点はチームで補強すれば解決できるタイプの弱点です(得意な仲間に頼る方向で書いてください)'
    : 'この弱点は他人に任せられない、自分自身のペースで育てていく必要があるタイプの弱点です(自分で育てる方向で書いてください)';

  // 本番サイトでは /api/personalize (サーバー側の取り次ぎ役)にリクエストする。
  // このプロトタイプをClaude.ai上で直接プレビューしている時は /api/personalize が存在しないため、
  // 自動的にプレビュー専用の簡易モード(直接API呼び出し)にフォールバックする。
  try{
    const response = await fetch('/api/personalize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        topLabel: topLabel,
        coreLabel: coreLabel,
        strategyNote: strategyNote,
        age: answersStore.age || '',
        gender: answersStore.gender || '',
        futureVision: answersStore.futureVision
      })
    });
    if(!response.ok){ throw new Error('proxy not available (status ' + response.status + ')'); }
    const data = await response.json();
    if(!data.message){ throw new Error('empty proxy response'); }
    return data.message;
  } catch(proxyError){
    // --- プレビュー用フォールバック(本番の /api/personalize がまだ無い環境向け) ---
    const prompt = 'あなたはパーソナルトレーナーのキャリア相談に乗るコーチです。以下の情報をもとに、日本語で3〜4文の、温かく背中を押すような短いメッセージを書いてください。専門用語は避け、話し言葉に近い自然な文章にしてください。前置きや見出しは不要で、メッセージ本文だけを出力してください。\n\n'
      + '【診断でわかった強み】' + topLabel + '\n'
      + '【診断でわかった弱点】' + coreLabel + '(' + strategyNote + ')\n'
      + '【本人が回答した年齢】' + (answersStore.age || '未回答') + '\n'
      + '【本人が回答した性別】' + (answersStore.gender || '未回答') + '\n'
      + '【本人が思い描く理想の未来像】' + answersStore.futureVision + '\n\n'
      + 'この未来像に対して、強みがどう追い風になるか、弱点とどう付き合っていけばいいかに具体的に触れながら書いてください。';

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    const text = data.content.map(function(item){ return item.type === "text" ? item.text : ""; }).filter(Boolean).join("\n");
    const trimmed = text.trim();
    if(!trimmed){ throw new Error('empty response'); }
    return trimmed;
  }
}

function finishResultRender(coreKey, topKey, coreCluster, coreAxis, aiText, aiFailed){
  const r = leafInfo[coreKey];
  const bridge = buildBridge(coreKey, r);
  const weaknessHtml = (coreAxis === 'value')
    ? buildWeaknessProseValue(coreKey, coreCluster)
    : buildWeaknessProseVision(coreKey);
  const weakIcon = (coreAxis === 'value') ? '🤝' : '🌱';
  const clusterAvg = computeClusterAverages();
  const radarSVG = buildRadarSVG(clusterAvg);

  let futureBoxHtml = '';
  if(answersStore.futureVision && answersStore.futureVision.trim().length > 0){
    const bodyText = aiText ? aiText : ('"' + answersStore.futureVision + '"を目指す上で、「' + leafLabel(topKey) + '」という強みが追い風になり、「' + leafLabel(coreKey) + '」を意識することが近道になりそうです。');
    const noteTag = aiFailed ? '<p class="fnote" style="font-size:10.5px;color:#B0A899;">※AIによる生成に失敗したため、簡易メッセージを表示しています。</p>' : '';
    const badge = aiText ? '<span class="ai-badge">AIが生成</span>' : '';
    futureBoxHtml = `
      <div class="future-box">
        <div class="ftitle">🌅 あなたの未来像に向けて ${badge}</div>
        <p>"${answersStore.futureVision}"</p>
        <p class="fnote">${bodyText}</p>
        ${noteTag}
      </div>
    `;
  }

  card.innerHTML = `
    <div class="mascot-wrap"><img src="${r.img}" alt=""></div>
    <div class="result">
      <div class="start-point">最初の入口: <b>${answersStore.concernLabel}</b> / 理想: <b>${answersStore.idealLabel}</b></div>
      <h2>${r.title}</h2>

      <div class="radar-section">
        <div class="radar-title">総合バランス(5点満点・領域別平均)</div>
        ${radarSVG}
      </div>

      <div class="bridge">${bridge}</div>

      <div class="badge-block strength">
        <div class="badge-header">
          <div class="badge-icon">🏆</div>
          <div class="badge-title-wrap">
            <div class="badge-label strength">あなたの強み</div>
            <div class="badge-title">${leafLabel(topKey)} <span class="badge-score">${scoreOutOf5(topKey)}/5点</span></div>
          </div>
        </div>
        ${buildStrengthProse(topKey)}
      </div>

      <div class="badge-block weak">
        <div class="badge-header">
          <div class="badge-icon">${weakIcon}</div>
          <div class="badge-title-wrap">
            <div class="badge-label weak">あなたの弱点</div>
            <div class="badge-title">${leafLabel(coreKey)} <span class="badge-score">${scoreOutOf5(coreKey)}/5点</span></div>
          </div>
        </div>
        ${weaknessHtml}
      </div>

      <div class="tree">
        <div class="tree-title">詳細スコア(全31項目・5点満点 / 赤=弱点 / 金=強み)</div>
        ${renderTree(coreKey, topKey)}
      </div>

      <div class="next-step">
        <span class="label">合わせて活用したい取り組み(${clusterLabels[coreCluster]}全般)</span>
        ${renderToolList(clusterTools[coreCluster])}
      </div>

      <div class="universal-box">
        <span class="label">全ての能力開発に共通する土台</span>
        ${renderToolList(universalTools)}
      </div>

      ${futureBoxHtml}

      <div class="objectivity-box">
        <div class="otitle">🔍 最後に:この結果をもっと正確にするために</div>
        <p>この診断は「自分で自分を採点する」自己評価です。とても大事な一歩ですが、限界もあります。心理学には「ジョハリの窓」という考え方があり、自分では気づいていないのに周りにはよく見えている部分(盲点)が、誰にでもあるとされています。自分の顔を鏡なしでは見られないのと同じで、自分の得意・不得意も、自分の目だけでは見えない部分があるのです。</p>
        <p>あなたのことをよく知っている人物複数人に、このテストを使ってあなたのことを評価してもらうと、客観的なヒントが得られます。ぜひ、信頼できる先輩や同僚、上司にも一度試してもらってみてください。</p>
      </div>

      <button class="restart" id="restart">もう一度診断する</button>
    </div>
  `;
  document.getElementById('restart').addEventListener('click', ()=>{
    stepIndex = 0;
    Object.keys(answersStore).forEach(k=> delete answersStore[k]);
    leafQuestions.forEach(d=>{ leafScores[d.key] = 0; });
    renderStep();
  });
}

renderStep();
</script>
</body>
</html>
